general:
  random_seed: 2024
  n_jobs: 1
  group_column: "study_patient_id"
  development_start_year: 1997
  development_end_year: 2020
  temporal_start_year: 2021
  temporal_end_year: 2026
  expected_total_n: 687
  expected_development_n: 564
  expected_temporal_n: 123
  enforce_manuscript_counts: true

pcoma_c:
  model_type: "catboost_binary"
  target: "derived_high_complexity_case"
  features:
    - "neck_width_mm"
    - "dome_to_neck_ratio"
    - "pcoa_adherent_to_sac"
    - "perforator_origin_from_p1"
    - "parent_ica_curvature_deg"
    - "pcoa_incorporated_neck"
    - "aneurysm_max_diameter_mm"
    - "aspect_ratio"
    - "parent_ica_tortuosity_index"
    - "distance_to_pcoa_ostium_mm"
    - "cn3_grooving_present"
    - "p1_diameter_mm"

pcoma_r:
  model_type: "catboost_binary"
  target: "derived_procedure_related_ischemia_flag"
  features:
    - "aspect_ratio"
    - "neck_width_mm"
    - "pcoa_incorporated_neck"
    - "p1_diameter_mm"
    - "pcoa_adherent_to_sac"
    - "largest_perforator_diameter_mm"
    - "pcoa_stretched_over_dome"
    - "perforator_count_estimated"
    - "acha_distance_from_neck_mm"

pcoma_o_aft:
  model_type: "xgboost_aft"
  eligibility_column: "preop_cn3_palsy"
  event_indicator: "pcoma_o_event"
  time_column: "pcoma_o_time_days"
  features:
    - "preop_cn3_duration_days"
    - "cn3_grooving_present"
    - "preop_cn3_complete_or_partial"
    - "neck_width_mm"
    - "age_years"
    - "pcoa_diameter_mm"
    - "cn3_compression_grade"
    - "preop_cn3_pupil_involvement"

pcoma_o_landmark:
  model_type: "xgboost_binary"
  eligibility_column: "preop_cn3_palsy"
  target: "derived_cn3_nonrecovery_12m"
  positive_class: "persistent CN III dysfunction at 12 months"
  features:
    - "preop_cn3_duration_days"
    - "cn3_grooving_present"
    - "preop_cn3_complete_or_partial"
    - "neck_width_mm"
    - "age_years"
    - "pcoa_diameter_mm"
    - "cn3_compression_grade"
    - "preop_cn3_pupil_involvement"

pcoma_e_binary:
  model_type: "elastic_net_binary"
  target: "derived_poor_outcome_90d"
  eligibility_column: "mrs_90d_window_eligible_flag"
  features:
    - "rupture_status"
    - "age_years"
    - "preop_nihss_total"
    - "baseline_mrs"
    - "admission_gcs_total"
    - "acha_distance_from_neck_mm"
    - "hunt_hess_grade"
    - "wfns_grade"

pcoma_e_ordinal:
  model_type: "ordered_logit"
  target: "mrs_90d"
  eligibility_column: "mrs_90d_window_eligible_flag"
  features:
    - "rupture_status"
    - "age_years"
    - "preop_nihss_total"
    - "baseline_mrs"
    - "admission_gcs_total"
    - "acha_distance_from_neck_mm"
    - "hunt_hess_grade"
    - "wfns_grade"
